<html>
<head>
  <title>Desafios - Lumina</title>
  
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #2e2854;      /* Roxo escuro */
      --card-bg: #fff8e7;        /* Bege claro */
      --card-shadow: #c8bdab;    /* Sombra bege */
      --text-color: #2e2854;    /* Cor do texto */
      --correct-color: #4CAF50;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Fredoka', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      color: var(--text-color);
      padding-bottom: 3rem;
    }

    /* Cabeçalho */
    .header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 2rem 3rem;
    }

    .logo-link {
      font-family: 'Pacifico', cursive;
      font-size: 2.5rem;
      color: var(--card-bg);
      text-decoration: none;
      user-select: none;
      transition: opacity 0.2s ease;
    }

    .logo-link:hover {
      opacity: 0.9;
    }

    /* Estrela Decorativa (Direita Superior) */
    .star-icon {
      position: absolute;
      top: 2rem;
      right: 3rem;
      color: var(--card-bg);
      font-size: 3.5rem;
      user-select: none;
      cursor: pointer;
      display: inline-block;
      z-index: 10;
    }

    @keyframes spinAnimation {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .star-icon.spin {
      animation: spinAnimation 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Conteúdo Principal */
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      padding: 1rem 2rem;
      max-width: 650px;
      margin: 0 auto;
      width: 100%;
    }

    /* Card Principal */
    .challenge-card {
      background-color: var(--card-bg);
      width: 100%;
      padding: 2.5rem 2rem;
      border-radius: 24px;
      box-shadow: 6px 8px 0px var(--card-shadow);
    }

    .challenge-card h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid rgba(46, 40, 84, 0.2);
      padding-bottom: 0.5rem;
      text-align: center;
    }

    /* Formulário de Seleção */
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 1.2rem;
    }

    .form-group label {
      font-weight: 600;
      margin-bottom: 0.4rem;
      font-size: 1rem;
    }

    .form-group select {
      padding: 0.8rem 1rem;
      border-radius: 12px;
      border: 2px solid var(--text-color);
      background-color: transparent;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      color: var(--text-color);
      outline: none;
      cursor: pointer;
    }

    /* Estilos da Pergunta e Opções */
    .question-box {
      margin-bottom: 1.5rem;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .option-btn {
      background-color: transparent;
      border: 2px solid var(--text-color);
      color: var(--text-color);
      padding: 0.8rem 1rem;
      border-radius: 12px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .option-btn:hover {
      background-color: rgba(46, 40, 84, 0.1);
    }

    /* Tela de Sucesso */
    .congrats-box {
      text-align: center;
    }

    .congrats-box h2 {
      font-size: 2.5rem;
      color: var(--text-color);
      margin-bottom: 1rem;
    }

    .congrats-box p {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
    }

    /* Botões Padrão */
    .btn-action {
      width: 100%;
      padding: 1rem;
      font-size: 1.3rem;
      border-radius: 16px;
      margin-top: 1rem;
      background-color: var(--text-color);
      color: var(--card-bg);
      border: none;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 4px 5px 0px var(--card-shadow);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn-action:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 2px 0px var(--card-shadow);
    }

    .feedback-msg {
      margin-top: 1rem;
      color: #d9534f;
      font-weight: 600;
      text-align: center;
    }

    /* Responsividade */
    @media (max-width: 600px) {
      .star-icon {
        top: 1.5rem;
        right: 1.5rem;
      }
      .challenge-card {
        padding: 1.8rem 1.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Cabeçalho (Logo na esquerda superior) -->
  <header class="header">
    <a href="home.html" class="logo-link">Lumina</a>
  </header>

  <!-- Estrela Decorativa (Direita Superior) -->
  <div class="star-icon" id="star">✦</div>

  <!-- Conteúdo Principal -->
  <main class="main-container">

    <div class="challenge-card">
      
      <!-- FASE 1: Seleção de Matéria e Dificuldade -->
      <div id="step-select">
        <h1>Desafios</h1>
        
        <div class="form-group">
          <label for="dificuldade">Dificuldade</label>
          <select id="dificuldade">
            <option value="Fácil">Fácil</option>
            <option value="Médio">Médio</option>
            <option value="Difícil">Difícil</option>
          </select>
        </div>

        <div class="form-group">
          <label for="materia">Matéria</label>
          <select id="materia">
            <option value="Matemática">Matemática</option>
            <option value="Química">Química</option>
            <option value="Física">Física</option>
            <option value="Biologia">Biologia</option>
          </select>
        </div>

        <button class="btn-action" onclick="startChallenge()">Gerar Desafio</button>
      </div>

      <!-- FASE 2: Exibição da Pergunta -->
      <div id="step-question" style="display: none;">
        <div class="question-box">
          <p class="question-text" id="question-title"></p>
          <div class="options-list" id="options-container"></div>
        </div>
        <div id="feedback" class="feedback-msg"></div>
      </div>

      <!-- FASE 3: Tela de Parabéns -->
      <div id="step-congrats" class="congrats-box" style="display: none;">
        <h2>Parabéns! 🎉</h2>
        <p>Você acertou a resposta e concluiu o desafio com sucesso!</p>
        <button class="btn-action" onclick="resetChallenge()">Retornar para mais um desafio</button>
      </div>

    </div>

  </main>

  <script>
    // Banco de Perguntas (2 por matéria)
    const questionsDatabase = {
      "Matemática": [
        {
          pergunta: "Quanto é 7 x 8?",
          opcoes: ["48", "54", "56", "64"],
          correta: 2
        },
        {
          pergunta: "Qual é a raiz quadrada de 144?",
          opcoes: ["10", "12", "14", "16"],
          correta: 1
        }
      ],
      "Química": [
        {
          pergunta: "Qual é a fórmula química da água?",
          opcoes: ["CO2", "H2O", "NaCl", "O2"],
          correta: 1
        },
        {
          pergunta: "Qual elemento possui o símbolo 'O' na tabela periódica?",
          opcoes: ["Ouro", "Osmo", "Oxigênio", "Oganessônio"],
          correta: 2
        }
      ],
      "Física": [
        {
          pergunta: "De acordo com a física, qual é o valor aproximado da aceleração da gravidade na Terra?",
          opcoes: ["5 m/s²", "9,8 m/s²", "15 m/s²", "20 m/s²"],
          correta: 1
        },
        {
          pergunta: "Qual é a unidade de medida de força no Sistema Internacional?",
          opcoes: ["Joule", "Watt", "Pascal", "Newton"],
          correta: 3
        }
      ],
      "Biologia": [
        {
          pergunta: "Qual organela celular é responsável pela produção de energia (ATP)?",
          opcoes: ["Mitocôndria", "Complexo de Golgi", "Ribossomo", "Lisossomo"],
          correta: 0
        },
        {
          pergunta: "Qual dessas opções é um ser autótrofo?",
          opcoes: ["Fungo", "Planta", "Animal", "Bactéria heterotrófica"],
          correta: 1
        }
      ]
    };

    let currentCorrectOption = null;

    function startChallenge() {
      const materia = document.getElementById('materia').value;
      const questionsList = questionsDatabase[materia];
      
      // Sorteia uma das duas perguntas da matéria escolhida
      const randomIndex = Math.floor(Math.random() * questionsList.length);
      const questionData = questionsList[randomIndex];

      currentCorrectOption = questionData.correta;

      // Monta a pergunta na tela
      document.getElementById('question-title').innerText = questionData.pergunta;
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      document.getElementById('feedback').innerText = '';

      questionData.opcoes.forEach((opcao, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opcao;
        btn.onclick = () => checkAnswer(index);
        optionsContainer.appendChild(btn);
      });

      // Alterna as telas
      document.getElementById('step-select').style.display = 'none';
      document.getElementById('step-question').style.display = 'block';
    }

    function checkAnswer(selectedIndex) {
      if (selectedIndex === currentCorrectOption) {
        document.getElementById('step-question').style.display = 'none';
        document.getElementById('step-congrats').style.display = 'block';
      } else {
        document.getElementById('feedback').innerText = 'Resposta incorreta. Tente novamente!';
      }
    }

    function resetChallenge() {
      document.getElementById('step-congrats').style.display = 'none';
      document.getElementById('step-select').style.display = 'block';
    }

    // Animação da estrela
    const star = document.getElementById('star');
    star.addEventListener('click', () => {
      star.classList.add('spin');
      star.addEventListener('animationend', () => {
        star.classList.remove('spin');
      }, { once: true });
    });
  </script>

</body>
</html>
