<html>
<head>
  <title>Cadastro - Lumina</title>
  
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{css_path}}">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="header">
    <a href="{{inicio_path}}" class="logo-link">Lumina</a>
    <a href="{{login_path}}" class="btn btn-sm">Login</a>
  </header>

  <!-- Conteúdo Principal -->
  <main class="main-container">
    
    <!-- Texto acima do quadrado -->
    <div class="header-text">
      <h1>Vamos estudar!</h1>
      <p>Registre-se e continue sua jornada de aprendizado. Aqui, cada acesso é uma nova chance de evoluir, revisar conteúdos e conquistar seus objetivos com confiança.</p>
    </div>

    <!-- Quadrado/Card de Registro -->
    <div class="register-card">
      <form action="{{ url_for('cadastro') }}" method="POST">
        
        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="nickname">Nickname</label>
          <input type="text" id="nickname" name="nickname" placeholder="Como quer ser chamado(a)" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Sua senha secreta" required>
        </div>

        <button type="submit" class="btn btn-submit">Cadastrar</button>

      </form>
    </div>

  </main>

  <!-- Elemento Decorativo -->
  <div class="star-icon" id="star">✦</div>

  <!-- Script para a animação da estrela -->
  <script>
    const star = document.getElementById('star');

    star.addEventListener('click', () => {
      star.classList.add('spin');

      star.addEventListener('animationend', () => {
        star.classList.remove('spin');
      }, { once: true });
    });
  </script>

</body>
</html>
