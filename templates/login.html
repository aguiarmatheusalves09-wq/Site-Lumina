<html>
<head>
  <title>Login - Lumina</title>
  
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    /* Reseta margens e configurações globais */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #2e2854;      /* Roxo escuro do fundo */
      --btn-bg: #fff8e7;        /* Bege claro/creme */
      --btn-shadow: #c8bdab;    /* Sombra bege mais escura */
      --text-color: #2e2854;    /* Cor do texto principal */
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Fredoka', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      color: var(--btn-bg);
      padding-bottom: 3rem;
    }

    /* Cabeçalho */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 3rem;
    }

    .logo-link {
      font-family: 'Pacifico', cursive;
      font-size: 2.5rem;
      color: var(--btn-bg);
      text-decoration: none;
      user-select: none;
    }

    /* Botão de navegação (Cadastre-se) */
    .btn {
      background-color: var(--btn-bg);
      color: var(--text-color);
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      text-align: center;
      box-shadow: 3px 4px 0px var(--btn-shadow);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      cursor: pointer;
      border: none;
    }

    .btn-sm {
      padding: 0.6rem 2rem;
      font-size: 1.1rem;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 2px 0px var(--btn-shadow);
    }

    /* Conteúdo Principal */
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      padding: 1rem 2rem;
      max-width: 650px;
      margin: 0 auto;
      width: 100%;
    }

    /* Textos Superiores */
    .header-text {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header-text h1 {
      font-size: 3rem;
      margin-bottom: 0.8rem;
      font-weight: 600;
    }

    .header-text p {
      font-size: 1.1rem;
      line-height: 1.5;
      font-weight: 400;
      opacity: 0.9;
    }

    /* Card/Quadrado do Formulário */
    .login-card {
      background-color: var(--btn-bg);
      color: var(--text-color);
      width: 100%;
      padding: 2.5rem 2rem;
      border-radius: 24px;
      box-shadow: 6px 8px 0px var(--btn-shadow);
    }

    /* Estilização dos Inputs */
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 1.2rem;
    }

    .form-group label {
      font-weight: 600;
      margin-bottom: 0.4rem;
      font-size: 1rem;
    }

    .form-group input {
      padding: 0.8rem 1rem;
      border-radius: 12px;
      border: 2px solid var(--text-color);
      background-color: transparent;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      color: var(--text-color);
      outline: none;
    }

    .form-group input:focus {
      background-color: rgba(255, 255, 255, 0.4);
    }

    /* Botão de Envio do Formulário */
    .btn-submit {
      width: 100%;
      padding: 1rem;
      font-size: 1.4rem;
      border-radius: 16px;
      margin-top: 1rem;
      box-shadow: 4px 5px 0px var(--btn-shadow);
    }

    /* Estrela decorativa e animação */
    .star-icon {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      color: var(--btn-bg);
      font-size: 3.5rem;
      user-select: none;
      cursor: pointer;
      display: inline-block;
    }

    @keyframes spinAnimation {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .star-icon.spin {
      animation: spinAnimation 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Responsividade */
    @media (max-width: 600px) {
      .header-text h1 {
        font-size: 2.2rem;
      }
      .header-text p {
        font-size: 1rem;
      }
      .login-card {
        padding: 1.8rem 1.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header class="header">
    <a href="index.html" class="logo-link">Lumina</a>
    <a href="cadastro.html" class="btn btn-sm">Cadastre-se</a>
  </header>

  <!-- Conteúdo Principal -->
  <main class="main-container">
    
    <!-- Texto acima do quadrado -->
    <div class="header-text">
      <h1>Bem vindo(a) de volta!</h1>
      <p>Estamos felizes em ter você aqui novamente. Faça seu login para continuar de onde parou e aproveitar todos os recursos disponíveis na plataforma. Desejamos bons estudos, foco e muito sucesso na sua jornada de aprendizado.</p>
    </div>

    <!-- Quadrado/Card de Login -->
    <div class="login-card">
      <form action="#" method="POST">
        
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
        </div>

        <button type="submit" class="btn btn-submit">Entrar</button>

      </form>
    </div>

  </main>

  <!-- Elemento Decorativo -->
  <div class="star-icon" id="star">✦</div>

  <!-- Script para a animação da estrela -->
  <script>
    const star = document.getElementById('star');

    star.addEventListener('click', () => {
      star.classList.add('spin');

      star.addEventListener('animationend', () => {
        star.classList.remove('spin');
      }, { once: true });
    });
  </script>

</body>
</html>
