<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil - Lumina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ css_path }}">
</head>
<body>

  <header class="header">
    <a href="{{ home_path }}" class="logo-link">Lumina</a>
  </header>

  <div class="star-icon" id="star">✦</div>

  <main class="main-container main-sm">
    <div class="card config-card">

      <!-- Abas: Perfil / Editar -->
      <div class="profile-tabs">
        <button class="profile-tab-btn active" onclick="switchProfileTab('view', this)">Perfil</button>
        <button class="profile-tab-btn" onclick="switchProfileTab('edit', this)">Editar</button>
      </div>

      <!-- ===== PAINEL: VISUALIZAR PERFIL ===== -->
      <div id="panel-view" class="profile-panel active">
        <div class="profile-view">

          <div class="profile-avatar-lg" id="profileAvatarLg">👤</div>

          <div class="profile-info">
            <div class="profile-name" id="displayName">Seu Nome</div>
            <div class="profile-nickname" id="displayNickname">@seunickname</div>
            <div class="profile-email" id="displayEmail">seuemail@exemplo.com</div>
          </div>

          <!-- Sequência + Recordes -->
          <div class="streak-row">
            <div class="streak-card">
              <div class="streak-icon">🔥</div>
              <div class="streak-value" id="streakCount">0</div>
              <div class="streak-label">Dias seguidos</div>
            </div>
            <div class="streak-card">
              <div class="streak-icon">🏆</div>
              <div class="streak-value" id="streakBest">0</div>
              <div class="streak-label">Melhor sequência</div>
            </div>
            <div class="streak-card">
              <div class="streak-icon">📅</div>
              <div class="streak-value" id="totalDays">0</div>
              <div class="streak-label">Total de dias</div>
            </div>
          </div>

          <!-- Barra de dias da semana -->
          <div class="streak-week">
            <div class="streak-week-title">Esta semana</div>
            <div class="streak-days" id="weekDays"></div>
          </div>

          <!-- Botão de marcar acesso do dia -->
          <button class="btn-action" id="checkInBtn" onclick="doCheckIn()" style="margin-top:0">
            ✓ Marcar acesso de hoje
          </button>

        </div>
      </div>

      <!-- ===== PAINEL: EDITAR PERFIL ===== -->
      <div id="panel-edit" class="profile-panel">

        <form action="" method="POST" enctype="multipart/form-data">

          <div class="profile-upload">
            <div class="avatar-preview" id="avatarPreview">👤</div>
            <div>
              <label for="foto" class="file-input-label">Alterar Foto de Perfil</label>
              <input type="file" id="foto" name="foto" accept="image/*">
            </div>
          </div>

          <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome completo">
          </div>

          <div class="form-group">
            <label for="nickname">Nickname</label>
            <input type="text" id="nickname" name="nickname" placeholder="Como quer ser chamado(a)">
          </div>

          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
          </div>

          <div class="form-group">
            <label for="nova-senha">Nova Senha (opcional)</label>
            <input type="password" id="nova-senha" name="nova-senha" placeholder="Digite a nova senha">
          </div>

          <p class="divider">Confirmação de Segurança</p>

          <div class="form-group">
            <label for="senha-atual">Senha Atual</label>
            <input type="password" id="senha-atual" name="senha-atual" placeholder="Digite sua senha atual para salvar" required>
          </div>

          <button type="submit" class="btn-action">Salvar Alterações</button>

        </form>
      </div>

    </div>
  </main>

  <script>
    // ── Alternância de abas ──────────────────────────────────────
    function switchProfileTab(panelId, btn) {
      document.querySelectorAll('.profile-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.profile-tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('panel-' + panelId).classList.add('active');
      btn.classList.add('active');
      if (panelId === 'view') refreshProfileView();
    }

    // ── Dados do perfil (simulado; no Flask virá do servidor) ────
    const profile = JSON.parse(localStorage.getItem('lumina_profile') || 'null') || {
      name: 'Seu Nome',
      nickname: 'seunickname',
      email: 'seuemail@exemplo.com',
      photo: null
    };

    // ── Streak / Sequência ───────────────────────────────────────
    function loadStreak() {
      return JSON.parse(localStorage.getItem('lumina_streak') || 'null') || {
        current: 0,
        best: 0,
        total: 0,
        lastDate: null,
        weekDone: []          // array de datas ISO dos últimos 7 dias com check-in
      };
    }

    function saveStreak(s) { localStorage.setItem('lumina_streak', JSON.stringify(s)); }

    function todayISO() { return new Date().toISOString().slice(0, 10); }

    function doCheckIn() {
      const s = loadStreak();
      const today = todayISO();
      if (s.lastDate === today) { alert('Você já marcou o acesso de hoje! 🎉'); return; }

      // Calcula sequência
      const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayISO = yesterday.toISOString().slice(0, 10);
      s.current = (s.lastDate === yesterdayISO) ? s.current + 1 : 1;
      s.best = Math.max(s.best, s.current);
      s.total += 1;
      s.lastDate = today;

      // Mantém só os últimos 7 dias únicos
      if (!s.weekDone.includes(today)) s.weekDone.push(today);
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 6);
      const cutoffISO = cutoff.toISOString().slice(0, 10);
      s.weekDone = s.weekDone.filter(d => d >= cutoffISO);

      saveStreak(s);
      refreshProfileView();
      document.getElementById('checkInBtn').textContent = '✓ Acesso marcado!';
      document.getElementById('checkInBtn').disabled = true;
      document.getElementById('checkInBtn').style.opacity = '0.6';
    }

    // ── Barra semanal ────────────────────────────────────────────
    const DAYS_PT = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

    function buildWeekBar(weekDone) {
      const container = document.getElementById('weekDays');
      container.innerHTML = '';
      const today = new Date();
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today); d.setDate(today.getDate() - i);
        const iso = d.toISOString().slice(0, 10);
        const isDone = weekDone.includes(iso);
        const isToday = i === 0;
        const div = document.createElement('div');
        div.className = 'streak-day';
        div.innerHTML = `
          <div class="streak-day-label">${DAYS_PT[d.getDay()]}</div>
          <div class="streak-day-circle ${isDone ? 'done' : ''} ${isToday && !isDone ? 'today-circle' : ''}">
            ${isDone ? '✓' : (isToday ? '·' : '')}
          </div>`;
        container.appendChild(div);
      }
    }

    // ── Atualizar visualização ───────────────────────────────────
    function refreshProfileView() {
      const s = loadStreak();
      document.getElementById('streakCount').textContent = s.current;
      document.getElementById('streakBest').textContent = s.best;
      document.getElementById('totalDays').textContent = s.total;
      buildWeekBar(s.weekDone);

      // Nome / nickname / email
      document.getElementById('displayName').textContent = profile.name;
      document.getElementById('displayNickname').textContent = '@' + profile.nickname;
      document.getElementById('displayEmail').textContent = profile.email;
      if (profile.photo) {
        document.getElementById('profileAvatarLg').innerHTML = `<img src="${profile.photo}" alt="Foto">`;
      }

      // Botão de check-in
      const btn = document.getElementById('checkInBtn');
      if (s.lastDate === todayISO()) {
        btn.textContent = '✓ Acesso já marcado hoje!';
        btn.disabled = true;
        btn.style.opacity = '0.6';
      } else {
        btn.textContent = '✓ Marcar acesso de hoje';
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }

    // ── Preview foto ao editar ───────────────────────────────────
    document.getElementById('foto').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        document.getElementById('avatarPreview').innerHTML = `<img src="${evt.target.result}" alt="Foto">`;
      };
      reader.readAsDataURL(file);
    });

    // ── Animação estrela ─────────────────────────────────────────
    const star = document.getElementById('star');
    star.addEventListener('click', () => {
      star.classList.add('spin');
      star.addEventListener('animationend', () => star.classList.remove('spin'), { once: true });
    });

    // ── Init ─────────────────────────────────────────────────────
    refreshProfileView();
  </script>

</body>
</html>
