<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumina - Home</title>

  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-home">

  <header class="header">
    <a href="{{ home_path }}" class="logo-link">Lumina</a>
  </header>

  <!-- Estrela (leva para Configurações) -->
  <a href="{{ config_path }}" class="star-link">
    <div class="star-icon" id="star">✦</div>
  </a>

  <section class="hero-section">
    <div class="hero-stripe"></div>
    <h1 class="hero-title">Lumina</h1>
    <p class="hero-subtitle">Sua jornada de aprendizado, organizada e leve.</p>
  </section>

  <main class="main-container main-home">
    <div class="menu-grid">

      <a href="{{ rotina_path }}" class="menu-card">
        <h2>Rotina</h2>
        <p>Organize seus horários semanais e mensais.</p>
      </a>

      <a href="{{ materias_path }}" class="menu-card">
        <h2>Matérias</h2>
        <p>Acesse conteúdos e assista às aulas.</p>
      </a>

      <a href="{{ desafios_path }}" class="menu-card">
        <h2>Desafios</h2>
        <p>Teste seus conhecimentos com quiz rápido.</p>
      </a>

      <a href="sobre.html" class="menu-card">
        <h2>Sobre</h2>
        <p>Conheça a plataforma e nossa missão.</p>
      </a>

    </div>
  </main>

  <script>
    // Animação da estrela
    const star = document.getElementById('star');
    star.addEventListener('click', () => {
      star.classList.add('spin');
      star.addEventListener('animationend', () => {
        star.classList.remove('spin');
      }, { once: true });
    });
  </script>

</body>
</html>
