<html>
<head>
  <title>Lumina - Home</title>
  
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #2e2854;      /* Roxo escuro */
      --card-bg: #fff8e7;        /* Bege claro */
      --card-shadow: #c8bdab;    /* Sombra bege */
      --text-color: #2e2854;    /* Cor do texto */
      --stripe-color: #3b3469;  /* Cor da faixa de fundo */
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Fredoka', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      color: var(--text-color);
      overflow-x: hidden;
    }

    /* Cabeçalho */
    .header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 2rem 3rem;
      z-index: 10;
    }

    .logo-link {
      font-family: 'Pacifico', cursive;
      font-size: 2.5rem;
      color: var(--card-bg);
      text-decoration: none;
      user-select: none;
      transition: opacity 0.2s ease;
    }

    .logo-link:hover {
      opacity: 0.9;
    }

    /* Estrela Decorativa (Direita Superior) */
    .star-icon {
      position: absolute;
      top: 2rem;
      right: 3rem;
      color: var(--card-bg);
      font-size: 3.5rem;
      user-select: none;
      cursor: pointer;
      display: inline-block;
      z-index: 10;
    }

    @keyframes spinAnimation {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .star-icon.spin {
      animation: spinAnimation 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Título com a Faixa */
    .hero-section {
      position: relative;
      width: 100%;
      padding: 4rem 2rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* FAIXA: Fica atrás do texto e vai até a borda direita */
    .hero-stripe {
      position: absolute;
      top: 50%;
      left: 30%;
      right: 0;
      height: 120px;
      background-color: var(--stripe-color);
      transform: translateY(-50%);
      border-top-left-radius: 60px;
      border-bottom-left-radius: 60px;
      z-index: 1;
    }

    .hero-title {
      font-family: 'Pacifico', cursive;
      font-size: 6rem;
      color: var(--card-bg);
      position: relative;
      z-index: 2;
      text-shadow: 4px 6px 0px rgba(0, 0, 0, 0.2);
    }

    .hero-subtitle {
      color: var(--card-bg);
      font-size: 1.2rem;
      margin-top: 1rem;
      position: relative;
      z-index: 2;
      opacity: 0.9;
    }

    /* Cards do Menu */
    .main-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      padding: 3rem 2rem;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      z-index: 2;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.8rem;
      width: 100%;
    }

    .menu-card {
      background-color: var(--card-bg);
      padding: 2rem 1.5rem;
      border-radius: 20px;
      box-shadow: 6px 8px 0px var(--card-shadow);
      text-decoration: none;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .menu-card:hover {
      transform: translateY(-5px);
      box-shadow: 6px 12px 0px var(--card-shadow);
    }

    .menu-card h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .menu-card p {
      font-size: 0.95rem;
      text-align: center;
      opacity: 0.8;
    }

    /* Responsividade */
    @media (max-width: 768px) {
      .hero-title {
        font-size: 4rem;
      }
      .hero-stripe {
        left: 10%;
        height: 90px;
      }
      .star-icon {
        top: 1.5rem;
        right: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header class="header">
    <a href="home.html" class="logo-link">Lumina</a>
  </header>

  <!-- Estrela Decorativa (Direita Superior) -->
  <div class="star-icon" id="star">✦</div>

  <section class="hero-section">
    <div class="hero-stripe"></div>
    <h1 class="hero-title">Lumina</h1>
    <p class="hero-subtitle">Sua jornada de aprendizado, organizada e leve.</p>
  </section>

  <!-- Navegação Principal -->
  <main class="main-container">
    <div class="menu-grid">
      
      <a href="rotina.html" class="menu-card">
        <h2>Rotina</h2>
        <p>Organize seus horários semanais e mensais.</p>
      </a>

      <a href="materias.html" class="menu-card">
        <h2>Matérias</h2>
        <p>Acesse conteúdos e assista às aulas.</p>
      </a>

      <a href="desafios.html" class="menu-card">
        <h2>Desafios</h2>
        <p>Teste seus conhecimentos com quiz rápido.</p>
      </a>

      <a href="sobre.html" class="menu-card">
        <h2>Sobre</h2>
        <p>Conheça a plataforma e nossa missão.</p>
      </a>

    </div>
  </main>

  <script>
    // Animação da estrela
    const star = document.getElementById('star');
    star.addEventListener('click', () => {
      star.classList.add('spin');
      star.addEventListener('animationend', () => {
        star.classList.remove('spin');
      }, { once: true });
    });
  </script>

</body>
</html>
