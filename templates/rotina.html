<html>
<head>
  <title>Rotina - Lumina</title>
  
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{css_path}}">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="header">
    <a href="{{home_path}}" class="logo-link">Lumina</a>
  </header>

  <!-- Estrela Decorativa (Direita Superior) -->
  <div class="star-icon" id="star">✦</div>

  <!-- Conteúdo Principal -->
  <main class="main-container">

    <div class="routine-card">
      
      <!-- Botões Ligar/Desligar Abas -->
      <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('semanal')">Cronograma Semanal</button>
        <button class="tab-btn" onclick="switchTab('mensal')">Cronograma Mensal</button>
      </div>

      <!-- CRONOGRAMA SEMANAL -->
      <div id="semanal" class="tab-content active">
        <div class="weekly-grid">
          
          <script>
            const dias = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
            dias.forEach(dia => {
              document.write(`
                <div class="day-column">
                  <h3>${dia}</h3>
                  <div class="time-slot">
                    <label>Manhã</label>
                    <textarea placeholder="Atividade..."></textarea>
                  </div>
                  <div class="time-slot">
                    <label>Tarde</label>
                    <textarea placeholder="Atividade..."></textarea>
                  </div>
                  <div class="time-slot">
                    <label>Noite</label>
                    <textarea placeholder="Atividade..."></textarea>
                  </div>
                </div>
              `);
            });
          </script>

        </div>
      </div>

      <!-- CRONOGRAMA MENSAL -->
      <div id="mensal" class="tab-content">
        <div class="monthly-grid">
          
          <script>
            for (let dia = 1; dia <= 31; dia++) {
              document.write(`
                <div class="month-day">
                  <span>Dia ${dia}</span>
                  <select>
                    <option value="">Selecione...</option>
                    <option value="Matemática">Matemática</option>
                    <option value="Química">Química</option>
                    <option value="Física">Física</option>
                    <option value="Biologia">Biologia</option>
                  </select>
                </div>
              `);
            }
          </script>

        </div>
      </div>

      <!-- Área do Botão de Ação -->
      <div class="action-container">
        <button class="save-btn" onclick="saveRoutine()">Salvar Alterações</button>
      </div>

    </div>

  </main>

  <script>
    // Controle de alternância das Abas (Ligar / Desligar)
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active');
      });
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });

      document.getElementById(tabName).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // Função temporária de salvar
    function saveRoutine() {
      alert('Alterações salvas com sucesso!');
    }

    // Animação da estrela
    const star = document.getElementById('star');
    star.addEventListener('click', () => {
      star.classList.add('spin');
      star.addEventListener('animationend', () => {
        star.classList.remove('spin');
      }, { once: true });
    });
  </script>

</body>
</html>
