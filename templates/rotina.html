<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotina - Lumina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="header">
    <a href="{{ home_path }}" class="logo-link">Lumina</a>
  </header>

  <a href="{{ config_path }}" class="star-link">
    <div class="star-icon" id="star">✦</div>
  </a>

  <main class="main-container main-top" style="max-width:1000px">
    <div class="card routine-card">

      <!-- ── Calendário + painel lateral ── -->
      <div class="routine-layout">

        <!-- Coluna esquerda: calendário -->
        <div>
          <!-- Cabeçalho do mês -->
          <div class="calendar-header">
            <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
            <h2 id="calMonthLabel"></h2>
            <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
          </div>

          <!-- Dias da semana -->
          <div class="cal-weekdays">
            <div class="cal-weekday">Dom</div>
            <div class="cal-weekday">Seg</div>
            <div class="cal-weekday">Ter</div>
            <div class="cal-weekday">Qua</div>
            <div class="cal-weekday">Qui</div>
            <div class="cal-weekday">Sex</div>
            <div class="cal-weekday">Sáb</div>
          </div>

          <!-- Grid de dias -->
          <div class="cal-grid" id="calGrid"></div>

          <!-- Legenda de matérias -->
          <div class="subject-badge-row" id="subjectBadges" style="margin-top:1.2rem">
            <span style="font-size:0.8rem;font-weight:600;opacity:0.5;align-self:center">Matéria do dia:</span>
            <button class="subject-badge active" onclick="selectSubject('', this)">Nenhuma</button>
            <button class="subject-badge" onclick="selectSubject('Mat', this)">Matemática</button>
            <button class="subject-badge" onclick="selectSubject('Quí', this)">Química</button>
            <button class="subject-badge" onclick="selectSubject('Fís', this)">Física</button>
            <button class="subject-badge" onclick="selectSubject('Bio', this)">Biologia</button>
          </div>
        </div>

        <!-- Coluna direita: painel do dia selecionado -->
        <div class="day-panel" id="dayPanel">
          <div class="day-panel-title">
            📋 <span id="selectedDayLabel">Selecione um dia</span>
          </div>

          <div class="period-block">
            <div class="period-label">☀️ Manhã</div>
            <textarea id="slotManha" placeholder="Atividades da manhã..." oninput="saveSlot()"></textarea>
          </div>
          <div class="period-block">
            <div class="period-label">🌤 Tarde</div>
            <textarea id="slotTarde" placeholder="Atividades da tarde..." oninput="saveSlot()"></textarea>
          </div>
          <div class="period-block">
            <div class="period-label">🌙 Noite</div>
            <textarea id="slotNoite" placeholder="Atividades da noite..." oninput="saveSlot()"></textarea>
          </div>
        </div>

      </div>

      <div class="action-container">
        <button class="save-btn" onclick="saveAll()">Salvar Rotina</button>
      </div>

    </div>
  </main>

  <script>
    // ── Estado ──────────────────────────────────────────────────
    const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                         'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const SUBJECTS = { 'Mat':'#c8bdab', 'Quí':'#c8bdab', 'Fís':'#c8bdab', 'Bio':'#c8bdab' };

    let viewYear, viewMonth, selectedDate = null;
    let routineData = JSON.parse(localStorage.getItem('lumina_routine') || '{}');
    // routineData[ISO] = { manha, tarde, noite, subj }

    function keyOf(y, m, d) {
      return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }

    // ── Calendário ───────────────────────────────────────────────
    function buildCalendar() {
      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';
      const label = document.getElementById('calMonthLabel');
      label.textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

      const today = new Date();
      const firstDay = new Date(viewYear, viewMonth, 1).getDay(); // 0=dom
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

      // Células vazias antes do dia 1
      for (let i = 0; i < firstDay; i++) {
        const blank = document.createElement('div');
        blank.className = 'cal-day empty';
        grid.appendChild(blank);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const iso = keyOf(viewYear, viewMonth, d);
        const data = routineData[iso] || {};
        const isToday = (d === today.getDate() && viewMonth === today.getMonth() && viewYear === today.getFullYear());
        const isSelected = (selectedDate === iso);

        const cell = document.createElement('div');
        cell.className = 'cal-day' + (isToday ? ' today' : '') + (isSelected ? ' selected' : '');
        cell.onclick = () => selectDay(iso, d);

        const numEl = document.createElement('div');
        numEl.className = 'cal-day-num';
        numEl.textContent = d;
        cell.appendChild(numEl);

        if (data.subj) {
          const subjEl = document.createElement('div');
          subjEl.className = 'cal-day-subj';
          subjEl.textContent = data.subj;
          cell.appendChild(subjEl);
        } else if (data.manha || data.tarde || data.noite) {
          const dot = document.createElement('div');
          dot.className = 'cal-day-dot';
          cell.appendChild(dot);
        }

        grid.appendChild(cell);
      }
    }

    function changeMonth(dir) {
      viewMonth += dir;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
      buildCalendar();
    }

    // ── Seleção de dia ───────────────────────────────────────────
    function selectDay(iso, d) {
      selectedDate = iso;
      buildCalendar();

      // Atualiza label
      document.getElementById('selectedDayLabel').innerHTML =
        `${d} de ${MONTH_NAMES[viewMonth]} <span>${viewYear}</span>`;

      // Carrega dados
      const data = routineData[iso] || {};
      document.getElementById('slotManha').value = data.manha || '';
      document.getElementById('slotTarde').value = data.tarde || '';
      document.getElementById('slotNoite').value = data.noite || '';

      // Atualiza badges de matéria
      const subj = data.subj || '';
      document.querySelectorAll('.subject-badge').forEach(b => {
        b.classList.toggle('active', b.dataset.subj === subj);
      });
    }

    // ── Matéria do dia ───────────────────────────────────────────
    function selectSubject(subj, btn) {
      if (!selectedDate) return;
      document.querySelectorAll('.subject-badge').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      routineData[selectedDate] = routineData[selectedDate] || {};
      routineData[selectedDate].subj = subj;
      buildCalendar();
    }

    // Atribui dataset.subj aos badges
    document.querySelectorAll('.subject-badge').forEach(btn => {
      const map = {'Nenhuma':'','Matemática':'Mat','Química':'Quí','Física':'Fís','Biologia':'Bio'};
      btn.dataset.subj = map[btn.textContent] ?? '';
    });

    // Reescreve onclick dos badges usando dataset
    document.querySelectorAll('.subject-badge').forEach(btn => {
      btn.onclick = () => selectSubject(btn.dataset.subj, btn);
    });

    // ── Salvar slot ao digitar ───────────────────────────────────
    function saveSlot() {
      if (!selectedDate) return;
      routineData[selectedDate] = routineData[selectedDate] || {};
      routineData[selectedDate].manha = document.getElementById('slotManha').value;
      routineData[selectedDate].tarde = document.getElementById('slotTarde').value;
      routineData[selectedDate].noite = document.getElementById('slotNoite').value;
    }

    function saveAll() {
      saveSlot();
      localStorage.setItem('lumina_routine', JSON.stringify(routineData));
      const btn = document.querySelector('.save-btn');
      btn.textContent = 'Salvo! ✓';
      setTimeout(() => btn.textContent = 'Salvar Rotina', 1800);
    }

    // ── Animação estrela ─────────────────────────────────────────
    const star = document.getElementById('star');
    star.addEventListener('click', () => {
      star.classList.add('spin');
      star.addEventListener('animationend', () => star.classList.remove('spin'), { once: true });
    });

    // ── Init ─────────────────────────────────────────────────────
    const now = new Date();
    viewYear  = now.getFullYear();
    viewMonth = now.getMonth();
    buildCalendar();

    // Seleciona hoje por padrão
    selectDay(keyOf(viewYear, viewMonth, now.getDate()), now.getDate());
  </script>

</body>
</html>
