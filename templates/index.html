<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumina</title>

  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="{{ css_path }}">
</head>
<body class="page-index">

  <header class="header header-end">
    <a href="{{ login_path }}" class="btn btn-sm">Login</a>
  </header>

  <main class="main-index">
    <img src="{{ logo_path }}" alt="Logo Lumina" class="logo-img">
    <a href="{{ cadastro_path }}" class="btn btn-lg">Cadastre</a>
  </main>

  <div class="star-icon star-bottom" id="star">✦</div>

  <script>
    // Animação da estrela
    const star = document.getElementById('star');
    star.addEventListener('click', () => {
      star.classList.add('spin');
      star.addEventListener('animationend', () => {
        star.classList.remove('spin');
      }, { once: true });
    });
  </script>

</body>
</html>
