<html>
<head>
<title>Lumina</title>
  
  <!-- Fonte do Google para os botões -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">

  <style>
    /* Reseta margens e configurações globais */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #2e2854;      /* Roxo escuro do fundo */
      --btn-bg: #fff8e7;        /* Bege claro/creme */
      --btn-shadow: #c8bdab;    /* Sombra bege mais escura */
      --text-color: #2e2854;    /* Cor do texto nos botões */
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Fredoka', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* Cabeçalho */
    .header {
      display: flex;
      justify-content: flex-end;
      padding: 2rem 3rem;
    }

    /* Conteúdo Central */
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      transform: translateY(-20px);
    }

    /* Imagem da Logo */
    .logo-img {
      max-width: 500px; /* Ajuste o tamanho máximo da sua logo aqui */
      width: 100%;
      height: auto;
      margin-bottom: 2rem;
      user-select: none;
    }

    /* Botões */
    .btn {
      background-color: var(--btn-bg);
      color: var(--text-color);
      text-decoration: none;
      border-radius: 16px;
      font-weight: 600;
      text-align: center;
      box-shadow: 4px 6px 0px var(--btn-shadow);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn-sm {
      padding: 0.6rem 2rem;
      font-size: 1.1rem;
      border-radius: 12px;
      box-shadow: 3px 4px 0px var(--btn-shadow);
    }

    .btn-lg {
      padding: 1.2rem 4rem;
      font-size: 2.2rem;
      border-radius: 20px;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 2px 0px var(--btn-shadow);
    }

    /* Estrela decorativa e animação */
    .star-icon {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      color: var(--btn-bg);
      font-size: 3.5rem;
      user-select: none;
      cursor: pointer;
      display: inline-block;
    }

    @keyframes spinAnimation {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .star-icon.spin {
      animation: spinAnimation 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header class="header">
    <a href="{{login_path}}" class="btn btn-sm">Login</a>
  </header>

  <!-- Conteúdo Principal -->
  <main class="main-container">
    <!-- Coloque o caminho da sua imagem no atributo src abaixo -->
    <img src="{{logo_path}}" alt="Logo Lumina" class="logo-img">
    <a href="{{cadastro_path}}" class="btn btn-lg">Cadastre</a>
  </main>

  <!-- Elemento Decorativo -->
  <div class="star-icon" id="star">✦</div>

  <!-- Script para a animação da estrela -->
  <script>
    const star = document.getElementById('star');

    star.addEventListener('click', () => {
      star.classList.add('spin');

      star.addEventListener('animationend', () => {
        star.classList.remove('spin');
      }, { once: true });
    });
  </script>

</body>
</html>
